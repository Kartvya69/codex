version: 2.1

# CI for the recodex (codex-rs) workspace.
#
# Jobs:
#   - build-and-test: runs on every push. fmt, debug build, tests, clippy.
#   - build-release-binaries: runs on version tags (v*). Cross-builds the
#     recodex binary for Linux x86_64 (gnu) and Windows x86_64 (msvc, via
#     cargo-xwin), publishes the artifacts, and — when GITHUB_TOKEN is set in
#     the CircleCI context — attaches them to the matching GitHub release.
#
# The Rust toolchain is pinned in codex-rs/rust-toolchain.toml (1.95.0).

jobs:
  build-and-test:
    docker:
      # cimg/rust ships rustup, so rust-toolchain.toml is honored as-is.
      - image: cimg/rust:1.95.0
    # Keep `large` (16 GB): nextest + sccache cut RSS substantially, but
    # codex-core's lib-test rustc still peaks ~3-4 GB each and the workspace
    # has many concurrent rustc/nextest processes. Do NOT drop to `medium`.
    resource_class: large
    environment:
      CARGO_TERM_COLOR: always
      # Cap build parallelism: at default (one rustc/vCPU) the peak RSS
      # exceeds the runner RAM and rustc is SIGKILLed. -j 2 holds peak ~10 GB.
      CARGO_BUILD_JOBS: "2"
      # Mirrors the justfile `test` target.
      RUST_MIN_STACK: "8388608"
      # sccache: avoid recompiling unchanged crates across dep bumps.
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_DIR: ~/.cache/sccache
    steps:
      - checkout

      # System deps:
      # - openssl-sys needs pkg-config + libssl-dev.
      # - codex-bwrap compiles vendored bubblewrap and links libcap.
      # - lld is the native Linux linker wired in codex-rs/.cargo/config.toml.
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libcap-dev lld

      # Install cargo-nextest (prebuilt official one-liner) and sccache
      # (prebuilt binary via cargo-binstall). Both avoid compiling from source.
      - run:
          name: Install cargo-nextest and sccache
          command: |
            curl -LsSf https://get.nexte.st/v0.9.96/linux-x86_64 | tar xz -C ${CARGO_HOME:-$HOME/.cargo}/bin
            cargo binstall -y --no-confirm sccache || curl -L https://github.com/mozilla/sccache/releases/latest/download/sccache-v0.8.1-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C ${CARGO_HOME:-$HOME/.cargo}/bin --wildcards '*/sccache'
            sccache --version && cargo nextest --version

      # sccache cache is keyed on a STABLE prefix so it survives dep bumps.
      - restore_cache:
          name: Restore sccache cache
          keys:
            - sccache-v1-

      - restore_cache:
          name: Restore cargo cache
          keys:
            - cargo-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}
            - cargo-v2-

      - run:
          name: Verify toolchain and fetch dependencies
          working_directory: codex-rs
          command: |
            rustup show active-toolchain
            cargo fetch --locked

      - run:
          name: Check formatting
          working_directory: codex-rs
          command: cargo fmt --all -- --check

      - run:
          name: Build CLI (early-fail signal)
          working_directory: codex-rs
          # Fast fail: build the primary CLI binary first. The full test
          # binaries are then compiled ONCE by `cargo nextest run` below.
          no_output_timeout: "60m"
          command: cargo build --locked --bin recodex

      - run:
          name: Test workspace (nextest, compiles test bins once)
          working_directory: codex-rs
          # nextest compiles the test binaries itself and runs them using far
          # less memory than libtest. .config/nextest.toml's [profile.default]
          # (retries=1, slow-timeout) is applied automatically in CI.
          no_output_timeout: "60m"
          command: cargo nextest run --workspace --locked --no-fail-fast

      - run:
          name: Clippy
          working_directory: codex-rs
          # Shares target/ with the steps above (no needless recompile).
          # workspace lints (unwrap_used, expect_used, ...) are already
          # deny-by-default in Cargo.toml; -D warnings makes everything fatal.
          command: cargo clippy --workspace --tests --locked -- -D warnings

      - save_cache:
          name: Save cargo cache
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - codex-rs/target
          key: cargo-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}

      - save_cache:
          name: Save sccache cache
          paths:
            - ~/.cache/sccache
          key: sccache-v1-{{ epoch }}

      - run:
          name: sccache stats
          command: sccache --show-stats || true

      - store_artifacts:
          path: codex-rs/target/debug/recodex
          destination: recodex-linux-debug

  build-release-binaries:
    docker:
      - image: cimg/rust:1.95.0
    resource_class: large
    environment:
      CARGO_TERM_COLOR: always
      # Keep -j 1. Measured on this workspace: even with [profile.dist]
      # (lto=false, opt-level=2, codegen-units=16), the biggest crates peak at
      # ~12.8 GB for a SINGLE rustc (codex-core), and -j 2 pushes the concurrent
      # sum to ~19.4 GB -> OOM on the 16 GB runner. dist is still a major win at
      # -j 1: it drops the thin-LTO silent stretch that made the old release
      # build hit the 60m no-output timeout, so wall-clock is much shorter.
      CARGO_BUILD_JOBS: "1"
      # sccache: avoid recompiling unchanged crates across dep bumps / releases.
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_DIR: ~/.cache/sccache
    steps:
      - checkout

      - run:
          name: Install system deps + Windows cross toolchain
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              pkg-config libssl-dev libcap-dev lld clang llvm zip

      # Install sccache + cargo-xwin from prebuilt binaries (no source compile).
      - run:
          name: Install sccache and cargo-xwin (prebuilt)
          command: |
            cargo binstall -y --no-confirm sccache cargo-xwin || \
              (curl -L https://github.com/mozilla/sccache/releases/latest/download/sccache-v0.8.1-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C ${CARGO_HOME:-$HOME/.cargo}/bin --wildcards '*/sccache' && \
               curl -L https://github.com/rust-cross/cargo-xwin/releases/latest/download/cargo-xwin-x86_64-unknown-linux-musl.tar.gz | tar xz -C ${CARGO_HOME:-$HOME/.cargo}/bin --wildcards '*/cargo-xwin')
            sccache --version && cargo xwin --version

      - run:
          name: Add Windows MSVC target
          command: rustup target add x86_64-pc-windows-msvc --toolchain 1.95.0

      - restore_cache:
          name: Restore release sccache cache
          keys:
            - rel-sccache-v1-

      - restore_cache:
          name: Restore release cargo cache
          keys:
            - rel-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}
            - rel-v2-

      - run:
          name: Fetch dependencies
          working_directory: codex-rs
          command: cargo fetch --locked

      - run:
          name: Build + package Linux x86_64 binary (profile dist)
          working_directory: codex-rs
          # Uses [profile.dist] (lto=false, opt-level=2, codegen-units=16):
          # much lower RSS than release so -j 2 fits. Output lands in target/dist.
          # Release rustc is silent for long stretches while optimizing the big
          # crates; raise the no-output timeout well past the 10m default.
          no_output_timeout: "60m"
          command: |
            cargo build --profile dist --locked --bin recodex
            strip target/dist/recodex
            (cd target/dist && tar -czf ../../recodex-x86_64-unknown-linux-gnu.tar.gz recodex)

      - run:
          name: Build + package Windows x86_64 binary (cross via cargo-xwin, profile dist)
          working_directory: codex-rs
          no_output_timeout: "60m"
          command: |
            cargo xwin build --profile dist --locked --target x86_64-pc-windows-msvc --bin recodex
            llvm-strip --strip-debug target/x86_64-pc-windows-msvc/dist/recodex.exe
            (cd target/x86_64-pc-windows-msvc/dist && zip -q recodex-x86_64-pc-windows-msvc.zip recodex.exe && mv recodex-x86_64-pc-windows-msvc.zip ../../../..)

      - save_cache:
          name: Save release cargo cache
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - codex-rs/target
            - ~/.cache/cargo-xwin
          key: rel-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}

      - save_cache:
          name: Save release sccache cache
          paths:
            - ~/.cache/sccache
          key: rel-sccache-v1-{{ epoch }}

      - run:
          name: sccache stats
          command: sccache --show-stats || true

      - store_artifacts:
          path: codex-rs/recodex-x86_64-unknown-linux-gnu.tar.gz
          destination: recodex-x86_64-unknown-linux-gnu.tar.gz
      - store_artifacts:
          path: codex-rs/recodex-x86_64-pc-windows-msvc.zip
          destination: recodex-x86_64-pc-windows-msvc.zip

      - run:
          name: Attach binaries to the GitHub release (tag + token only)
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Not a tag push; skipping release upload. Binaries are in this job's artifacts."
              exit 0
            fi
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "GITHUB_TOKEN not set; skipping release upload. Add it as a CircleCI context env to auto-publish. Binaries are in this job's artifacts."
              exit 0
            fi
            if ! command -v gh >/dev/null 2>&1; then
              sudo mkdir -p -m 755 /etc/apt/keyrings && \
                wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
                sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null && \
                sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && \
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
                sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && \
                sudo apt-get update && sudo apt-get install -y gh
            fi
            export GH_TOKEN="$GITHUB_TOKEN"
            REPO=Kartvya69/recodex
            # Create the release if it doesn't exist, then upload (clobber) both assets.
            gh release create "$CIRCLE_TAG" --repo "$REPO" --verify-tag --title "$CIRCLE_TAG" \
              --notes "recodex $CIRCLE_TAG — built by CircleCI" \
              codex-rs/recodex-x86_64-unknown-linux-gnu.tar.gz \
              codex-rs/recodex-x86_64-pc-windows-msvc.zip 2>/dev/null || \
            gh release upload "$CIRCLE_TAG" --repo "$REPO" --clobber \
              codex-rs/recodex-x86_64-unknown-linux-gnu.tar.gz \
              codex-rs/recodex-x86_64-pc-windows-msvc.zip

workflows:
  ci:
    jobs:
      - build-and-test
      - build-release-binaries:
          # Only on release tags — keeps CI minutes low on regular pushes.
          # Push a tag like `v0.1.2` to build + publish both binaries.
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+.*$/
            branches:
              ignore: /.*/
