version: 2.1

# Basic CI for the codex-rs workspace.
#
# What it does: fetch deps, check formatting, build the whole workspace
# (dev profile), run the test suite, and run clippy.
#
# The Rust toolchain is pinned in codex-rs/rust-toolchain.toml (1.95.0);
# rustup applies it automatically, so the image version is just a starting
# point.
#
# Free-tier note: resource_class=large stays within CircleCI's free plan
# (~2x the minute cost of medium). `medium` (4 GB) OOMs compiling codex-core's
# test target; `large` (16 GB) does not. This is a ~120-crate workspace, so a
# clean build still takes a while on 4 vCPU.

jobs:
  build-and-test:
    docker:
      # cimg/rust ships rustup, so rust-toolchain.toml is honored as-is.
      # If this exact tag is ever missing, use cimg/rust:1.95 instead.
      - image: cimg/rust:1.95.0
    # `large` (4 vCPU, 16 GB) is required instead of `medium` (4 GB): compiling
    # codex-core's lib-test target is memory-heavy (~3-4 GB per rustc) and two
    # concurrent rustc processes OOM (SIGKILL) on `medium`. `large` stays within
    # the free tier at 2x the minute cost.
    resource_class: large
    environment:
      CARGO_TERM_COLOR: always
      # Cap build parallelism: the lib-test targets of codex-core / codex-tui /
      # codex-cli each need ~4-5 GB to compile. At default parallelism (one rustc
      # per vCPU) the peak RSS exceeds the runner RAM and rustc is SIGKILLed
      # (OOM). -j 2 keeps peak ~10 GB, safely under `large`'s 16 GB.
      CARGO_BUILD_JOBS: "2"
      # Mirrors the justfile `test` target.
      RUST_MIN_STACK: "8388608"
    steps:
      - checkout

      # System deps:
      # - openssl-sys needs pkg-config + libssl-dev.
      # - codex-bwrap compiles vendored bubblewrap and links libcap.
      # - sqlx uses sqlite-bundled (no system sqlite needed).
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libcap-dev

      - restore_cache:
          keys:
            - cargo-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}
            - cargo-v2-

      - run:
          name: Verify toolchain and fetch dependencies
          working_directory: codex-rs
          command: |
            rustup show active-toolchain
            cargo fetch --locked

      - run:
          name: Check formatting
          working_directory: codex-rs
          command: cargo fmt --all -- --check

      - run:
          name: Build workspace (dev profile)
          working_directory: codex-rs
          # Build the primary CLI binary explicitly for a fast fail signal,
          # then the rest of the workspace with tests compiled.
          command: |
            cargo build --locked --bin recodex
            cargo build --workspace --tests --locked

      - run:
          name: Test workspace
          working_directory: codex-rs
          command: cargo test --workspace --no-fail-fast --locked

      - run:
          name: Clippy
          working_directory: codex-rs
          # workspace lints (unwrap_used, expect_used, ...) are already
          # deny-by-default in Cargo.toml; -D warnings makes everything fatal.
          command: cargo clippy --workspace --tests --locked -- -D warnings

      - save_cache:
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - codex-rs/target
          key: cargo-v2-{{ checksum "codex-rs/Cargo.lock" }}-{{ checksum "codex-rs/rust-toolchain.toml" }}

      - store_artifacts:
          path: codex-rs/target/debug/recodex
          destination: codex-binary

workflows:
  ci:
    jobs:
      - build-and-test
